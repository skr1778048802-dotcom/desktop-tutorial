<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正在打开商务出行手册</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7f7;color:#082f54;font:16px/1.6 system-ui,"PingFang SC",sans-serif}.box{text-align:center;padding:32px}.ring{width:42px;height:42px;margin:0 auto 18px;border:4px solid #d7e1e2;border-top-color:#e5ca53;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="ring"></div><b>正在打开 MIXC AIR 商务出行手册</b><p>首次载入约需数秒</p></div><script>
const parts=Array.from({length:15},(_,i)=>`../manual-latest-v6/part-${String(i).padStart(3,"0")}.txt`);
Promise.all(parts.map(x=>fetch(x,{cache:"force-cache"}).then(r=>{if(!r.ok)throw Error(r.status);return r.arrayBuffer()}))).then(bs=>{const size=bs.reduce((n,b)=>n+b.byteLength,0),all=new Uint8Array(size);let p=0;for(const b of bs){all.set(new Uint8Array(b),p);p+=b.byteLength}let html=new TextDecoder().decode(all);html=html.replace(/<section class="page" id="solutions">[\s\S]*?<\/section>\s*(?=<section class="page" id="journey">)/,'').replace(/<a href="#solutions"[^>]*>商务补给<\/a>/,'').replace('$("#solutionsLogo").src = I("logo.jpg");','if ($("#solutionsLogo")) $("#solutionsLogo").src = I("logo.jpg");');document.open();document.write(html);document.close()}).catch(()=>document.body.innerHTML='<div class="box"><b>页面载入失败</b><p>请检查网络后刷新重试。</p></div>');
</script></body></html>
