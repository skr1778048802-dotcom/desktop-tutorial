<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>西安机场T5商务出行手册｜MIXC AIR</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7f7; color: #082f54; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      main { text-align: center; padding: 24px; }
      i { display: block; width: 34px; height: 34px; margin: 0 auto 14px; border: 4px solid #d7e1e2; border-top-color: #e5ca53; border-radius: 50%; animation: spin .8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main><i></i><strong>正在加载完整手册…</strong><p>请稍候</p></main>
    <script>
      (async () => {
        const files = Array.from({ length: 24 }, (_, i) => `manual-content/part-${String(i + 1).padStart(3, "0")}.txt?v=full-20260923`);
        const responses = await Promise.all(files.map((file) => fetch(file)));
        if (responses.some((response) => !response.ok)) throw new Error("加载失败");
        const manual = (await Promise.all(responses.map((response) => response.text()))).join("");
        document.open();
        document.write(manual);
        document.close();
      })().catch(() => {
        document.querySelector("main").innerHTML = "<strong>手册加载失败，请刷新页面后重试。</strong>";
      });
    </script>
  </body>
</html>
