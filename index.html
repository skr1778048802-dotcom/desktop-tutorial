<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>西安机场T5商务出行手册｜MIXC AIR</title>
<style>
html,body{margin:0;min-height:100%;background:#edf4f5;color:#082f54;font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
body{min-height:100vh;display:grid;place-items:center}main{width:min(86vw,420px);text-align:center;padding:28px}
.logo{font-size:13px;font-weight:900;letter-spacing:.18em}.ring{width:42px;height:42px;margin:18px auto;border:4px solid #d3e0e3;border-top-color:#e1b23d;border-radius:50%;animation:spin .75s linear infinite}
.track{height:5px;margin:18px 0 8px;overflow:hidden;border-radius:9px;background:#d9e4e6}.bar{height:100%;width:0;background:linear-gradient(90deg,#0d5978,#1d9179);transition:.2s}
small{color:#58717d}@keyframes spin{to{transform:rotate(360deg)}}button{border:0;border-radius:9px;padding:10px 16px;background:#082f54;color:#fff;font-weight:800}
</style>
</head>
<body><main><div class="logo">MIXC AIR · XI'AN T5</div><div class="ring"></div><strong id="status">正在载入商务出行手册</strong><div class="track"><div class="bar" id="bar"></div></div><small id="progress">正在连接…</small></main>
<script>
(async()=>{const total=28,ver="20260929-2";let done=0;const status=document.getElementById("status"),progress=document.getElementById("progress"),bar=document.getElementById("bar");try{const jobs=Array.from({length:total},(_,i)=>fetch("manual-content-v5/part-"+String(i).padStart(3,"0")+".txt?v="+ver,{cache:"force-cache"}).then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.text()}).finally(()=>{done++;bar.style.width=(done/total*100)+"%";progress.textContent="已载入 "+done+" / "+total}));const html=(await Promise.all(jobs)).join("");status.textContent="正在打开…";document.open();document.write(html);document.close()}catch(e){status.textContent="载入未完成";progress.innerHTML='<button onclick="location.reload()">重新载入</button>'}})();
</script></body></html>
